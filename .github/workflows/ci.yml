# Repository checks for pull requests and main (ADR 0017 / ROO-162).
# Main merges run checks only — no container image build and no staging mutation.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.12.4"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Format
        run: |
          uv run ruff format --check
          uv run ruff check portal tests

      - name: Tests
        run: uv run pytest

      - name: Script tests
        run: for test in scripts/*.test.sh; do "$test"; done
