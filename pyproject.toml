[tool.pytest.ini_options]
testpaths = ["portal", "tests"]

[project]
name = "rooted-core-api"
version = "0.1.0"
description = "Rooted Core API — devotional app backend with admin platform services"
authors = [{ name = "Jay Hsia", email = "jayhsia1997@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # base
    "dependency-injector",
    "fastapi",
    "fastapi-limiter",
    "gunicorn>=25,<26",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    # db
    "asyncpg",
    "redis",
    "sqlalchemy",
    "psycopg2-binary",
    # security
    "pyjwt",
    "azure-storage-blob",
    # utils
    "boto3",
    "cryptography>=47,<48",
    "email-validator",
    "httpx",
    "ujson",
    "pytz",
    "pandas",
    "numpy",
    "phonenumbers",
    "pyotp",
    "python-dateutil",
    "python-multipart",
    "pyyaml",
    "sentry-sdk[fastapi]",
    "pillow",
    "aiosmtplib",
    "jinja2",
    "click",
]

[project.scripts]
rooted-cli = "portal.cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["portal*"]

[dependency-groups]
dev = ["alembic", "pytest", "pytest-asyncio", "pytest-mock", "ruff"]

[tool.uv]
package = true
required-version = ">=0.12.4,<0.13"

[tool.ruff]
target-version = "py314"
line-length = 160
extend-exclude = ["alembic/versions", "bible_data"]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["portal"]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "preserve"
skip-magic-trailing-comma = true
line-ending = "lf"
